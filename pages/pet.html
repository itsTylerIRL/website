<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>DigiFlip pet - Tyler (in real life)</title>
    <!-- The home page's DigiFlip panel (js/pet-panel.js) frames this: just your pet, run by the same js/digimon.js
         as pages/digimon.html (same saves in IndexedDB). The panel unloads it while DigiFlip itself is open, so
         only one copy runs at a time. In its own frame its keys (arrows, Z / X) never reach the home page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
    <style>
        :root { --cyan: #8be9fd; --cyan-rgb: 139, 233, 253; --dim: #5f8a99; --orange: #ffb86c; color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
        body {
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 8px 10px 9px;
            font-family: 'Share Tech Mono', ui-monospace, monospace;
            color: var(--dim);
            user-select: none;
            -webkit-user-select: none;
        }
        .flipper { display: contents; }
        .screen-wrap {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            place-items: center;
            border-radius: 6px;
            background: radial-gradient(ellipse at center, rgba(var(--cyan-rgb), 0.07), rgba(0, 0, 0, 0.55) 75%);
            box-shadow: inset 0 0 0 1px rgba(var(--cyan-rgb), 0.16);
            overflow: hidden;
        }
        /* the 2:1 screen as big as fits: the frame's height less the controls row (100vh is the frame's height) */
        canvas {
            display: block;
            width: min(100%, calc((100vh - 50px) * 2));
            height: auto;
            aspect-ratio: 2 / 1;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: drop-shadow(0 0 3px rgba(var(--cyan-rgb), 0.55));
            outline: none;
        }
        .status {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--cyan);
        }
        .status.hidden { display: none; }
        .status.error { color: #ff5555; letter-spacing: 0.04em; text-transform: none; padding: 8px; text-align: center; }
        .controls { display: flex; align-items: center; gap: 4px; flex: none; }
        .led {
            width: 9px;
            height: 9px;
            margin-right: 4px;
            border-radius: 50%;
            background: rgba(255, 184, 108, 0.15);
            box-shadow: inset 0 0 0 1px rgba(255, 184, 108, 0.35);
            flex: none;
        }
        .led.on { background: var(--orange); box-shadow: 0 0 8px var(--orange), 0 0 2px #fff inset; animation: blink 1s steps(2) infinite; }
        @keyframes blink { 50% { opacity: 0.35; } }
        button {
            flex: 1 1 0;
            min-width: 0;
            height: 24px;
            padding: 0;
            border: 1px solid rgba(var(--cyan-rgb), 0.3);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.45);
            color: #eaeaea;
            font: 12px 'Share Tech Mono', ui-monospace, monospace;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:hover { border-color: var(--cyan); background: rgba(var(--cyan-rgb), 0.12); }
        button.pressed { background: rgba(var(--cyan-rgb), 0.3); border-color: var(--cyan); }
        button[data-key="4"] { color: var(--cyan); }
        #digimon-sound { flex: none; width: auto; padding: 0 6px; font-size: 10px; color: var(--dim); letter-spacing: 0.04em; }
        @media (prefers-reduced-motion: reduce) { .led.on { animation: none; } }
    </style>
</head>
<body>
    <div class="flipper">
        <div class="screen-wrap">
            <canvas id="digimon-screen" width="128" height="64" tabindex="0" aria-label="Your DigiFlip pet"></canvas>
            <div class="status" id="digimon-status">loading&hellip;</div>
        </div>
        <div class="controls">
            <i class="led" id="digimon-led" title="call light: your digimon wants something"></i>
            <button type="button" data-key="3" aria-label="Left">&larr;</button>
            <button type="button" data-key="0" aria-label="Up">&uarr;</button>
            <button type="button" data-key="1" aria-label="Down">&darr;</button>
            <button type="button" data-key="2" aria-label="Right">&rarr;</button>
            <button type="button" data-key="4" aria-label="OK">&#9679;</button>
            <button type="button" data-key="5" aria-label="Back">&#8617;</button>
            <button type="button" id="digimon-sound" title="Sound">sound: on</button>
        </div>
    </div>
    <script defer src="/js/digimon.js?v=1.1"></script>
</body>
</html>
